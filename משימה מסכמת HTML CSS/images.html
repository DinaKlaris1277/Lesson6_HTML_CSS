<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChatGPT - Images</title>
    <link rel="stylesheet" href="images.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="nav-left">
            <span class="logo-text">ChatGPT</span>
        </div>
        
        <nav class="nav-center">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="images.html">Images</a></li>
                <li><a href="agent.html">Agent</a></li>
            </ul>
        </nav>

        <div class="nav-right">
            <button class="btn-login">Log in</button>
            <button class="btn-signup">Sign up for free</button>
            <button class="btn-request">Request info</button>
        </div>
    </header>

    <main class="images-container">
        <h1 class="page-title">Images</h1>
        
        <section class="gallery-section">
            <h2 class="section-subtitle">Try a style on an image</h2>
            
            <div class="gallery-row">
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/1011/120/150" alt="Sketch">
                    <p>Sketch</p>
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/1025/120/150" alt="Dynamic">
                    <p>Dynamic</p>
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/1062/120/150" alt="Mascot">
                    <p>Mascot</p>
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/1074/120/150" alt="Cyberpunk">
                    <p>Cyberpunk</p>
                </div>
                <div class="gallery-item">
                    <img src="https://picsum.photos/id/1084/120/150" alt="Bobblehead">
                    <p>Bobblehead</p>
                </div>
            </div>
        </section>

        <section class="discover-section">
            <h2 class="section-subtitle">Discover something new</h2>
            
            <div class="cards-row">
                <div class="card-item">
                    <img src="https://picsum.photos/id/237/50/50" alt="Discover 1">
                    <span>Me as The Girl with Pearl</span>
                </div>
                <div class="card-item">
                    <img src="https://picsum.photos/id/225/50/50" alt="Discover 2">
                    <span>Remove objects in the background</span>
                </div>
                <div class="card-item">
                    <img src="https://picsum.photos/id/219/50/50" alt="Discover 3">
                    <span>What would I look like as a King/Queen?</span>
                </div>
            </div>
        </section>
    </main>

</body>
</html>

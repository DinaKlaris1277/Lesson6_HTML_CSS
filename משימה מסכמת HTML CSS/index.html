<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChatGPT - Main</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="nav-left">
            <span class="logo-text">ChatGPT</span>
        </div>

        <nav class="nav-center">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="images.html">Images</a></li>
                <li><a href="agent.html">Agent</a></li>
            </ul>
        </nav>

        <div class="nav-right">
            <button class="btn-login">Log in</button>
            <button class="btn-signup">Sign up for free</button>
            <button class="btn-request">Request info</button>
        </div>
    </header>

    <main class="main-container">
        <h1 class="main-title">What's on the agenda today?</h1>

        <form class="search-form">
            <input type="text" placeholder="What would you like..." class="search-input">

            <div class="form-actions">
                <button type="button" class="action-btn"><span class="material-icons" style="font-size: 14px; vertical-align: middle;">attachment</span> Attach</button>
                <button type="button" class="action-btn"><span class="material-icons" style="font-size: 14px; vertical-align: middle;">search</span> Search</button>
                <button type="button" class="action-btn"><span class="material-icons" style="font-size: 14px; vertical-align: middle;">school</span> Study</button>
                <button type="button" class="action-btn"><span class="material-icons" style="font-size: 14px; vertical-align: middle;">auto_awesome</span> Create image</button>
            </div>
        </form>
    </main>

</body>
</html>
